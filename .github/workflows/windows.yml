name: Windows portable

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'public/**'
      - 'test/**'
      - 'scripts/windows-smoke.cjs'
      - 'package*.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Node tests
        shell: pwsh
        run: |
          npm test | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path tests.log -Pattern '^not ok' -Context 0,24
            foreach ($line in $lines) {
              $detail = ((@($line.Line) + $line.Context.PostContext) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$detail"
            }
            throw 'Node tests failed'
          }
      - run: npm run build:win
      - name: Verify the portable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/ByAzen-*-win-x64-portable.exe | Select-Object -First 1
          if (!$exe) { throw 'Portable package not found' }
          node scripts/windows-smoke.cjs --seed
          if ($LASTEXITCODE -ne 0) { throw "Portable test setup failed" }
          $proc = Start-Process $exe.FullName -ArgumentList "--remote-debugging-port=9225", "--remote-debugging-address=127.0.0.1" -PassThru
          try {
            $started = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ((Get-Process ByAzen -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like '*ByAzen*' })) {
                $started = $true
                break
              }
              if ($proc.HasExited) { break }
            }
            if (!$started) { throw 'ByAzen window did not appear' }
            node scripts/windows-smoke.cjs 2>&1 | Tee-Object -FilePath smoke.log
            if ($LASTEXITCODE -ne 0) {
              $detail = (Get-Content smoke.log -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$detail"
              throw 'Portable renderer smoke test failed'
            }
          } finally {
            Get-Process ByAzen -ErrorAction SilentlyContinue | Stop-Process -Force
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: ByAzen-win-x64-portable
          path: release/ByAzen-*-win-x64-portable.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.repository == 'gggvkvh405-rgb/1' && startsWith(github.ref, 'refs/heads/arena/') && contains(github.event.head_commit.message, '[publish byazen]')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ByAzen-win-x64-portable
          path: portable-release
      - name: Publish the verified portable executable and its SHA-256
        working-directory: portable-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(ByAzen-*-win-x64-portable.exe)
          [[ ${#files[@]} == 1 && ${files[0]} =~ ^ByAzen-([0-9]+\.[0-9]+\.[0-9]+)-win-x64-portable\.exe$ ]]
          version=${BASH_REMATCH[1]}
          sha256sum "${files[0]}" > "${files[0]}.sha256"
          gh release create "v$version" "${files[0]}" "${files[0]}.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ByAzen $version" --notes "Verified Windows x64 portable build and SHA-256. Extract or save the executable beside your existing ByAzen-data folder. The executable is unsigned."
